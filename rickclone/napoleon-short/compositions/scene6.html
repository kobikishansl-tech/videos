<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /></head>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; background: #000; overflow: hidden; }
    #s6-shakewrap { position: absolute; inset: 0; }
    #s6-kb { position: absolute; inset: 0; will-change: transform; }
    #s6-kb img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
    #s6-img-b { opacity: 0; }
    #s6-dip { position: absolute; inset: 0; background: #000; opacity: 0; }
    #s6-flash { position: absolute; inset: 0; background: #ffffff; opacity: 0; }
  </style>
  <div id="root" data-composition-id="scene6" data-width="1080" data-height="1920">
    <div id="s6-shakewrap" style="position:absolute; inset:0;">
    <div id="s6-kb" data-layout-allow-overflow>
      <img id="s6-img-a" src="assets/shot6.jpg" alt="" />
      <img id="s6-img-b" src="assets/shot6_b.jpg" alt="" />
    </div>
    </div>
    <div id="s6-dip" data-layout-ignore></div>
    <div id="s6-flash" data-layout-ignore></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s6-kb", { scale: 1.14 }, { scale: 1.3, z: 0.001, force3D: true, duration: 1.400, ease: "power3.inOut" }, 0);

      for (let i = 1, t = 0.33; t < 2.4; i++, t += 0.33) {
        tl.set("#s6-img-b", { opacity: i % 2 }, Number(t.toFixed(3)));
      }
      tl.to("#s6-dip", { opacity: 0.35, duration: 0.1, ease: "power2.in" }, 2.30);
      tl.fromTo("#s6-flash", { opacity: 1 }, { opacity: 0, duration: 0.14, ease: "power2.out" }, 0);
      let seed = 1337;
      const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
      const kf = [];
      const shakeLen = 2.20;
      for (let t = 0.08; t < shakeLen; t += 0.1) {
        const a = 5.0 * (1 - (t - 0.08) / (shakeLen - 0.08));
        kf.push({ x: ((rnd() * 2 - 1) * a).toFixed(2), y: ((rnd() * 2 - 1) * a).toFixed(2), duration: 0.1, ease: "none" });
      }
      tl.to("#s6-shakewrap", { keyframes: kf }, 0.08);

      window.__timelines["scene6"] = tl;
    })();
  </script>
</template>
</body>
</html>
