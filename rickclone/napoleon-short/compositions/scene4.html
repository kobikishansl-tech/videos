<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /></head>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; background: #000; overflow: hidden; }
    #s4-shakewrap { position: absolute; inset: 0; }
    #s4-kb { position: absolute; inset: 0; will-change: transform; }
    #s4-kb img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
    #s4-img-b { opacity: 0; }
    #s4-dip { position: absolute; inset: 0; background: #000; opacity: 0; }
  </style>
  <div id="root" data-composition-id="scene4" data-width="1080" data-height="1920">
    <div id="s4-kb" data-layout-allow-overflow>
      <img id="s4-img-a" src="assets/shot4.jpg" alt="" />
      <img id="s4-img-b" src="assets/shot4_b.jpg" alt="" />
    </div>
    <div id="s4-dip" data-layout-ignore></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s4-kb", { scale: 1.14, y: 24 }, { scale: 1.3, y: -24, z: 0.001, force3D: true, duration: 4.050, ease: "power2.inOut" }, 0);

      for (let i = 1, t = 0.33; t < 4.2; i++, t += 0.33) {
        tl.set("#s4-img-b", { opacity: i % 2 }, Number(t.toFixed(3)));
      }
      tl.fromTo("#s4-dip", { opacity: 0.35 }, { opacity: 0, duration: 0.14, ease: "power2.out" }, 0);
      tl.to("#s4-dip", { opacity: 0.35, duration: 0.1, ease: "power2.in" }, 4.10);

      window.__timelines["scene4"] = tl;
    })();
  </script>
</template>
</body>
</html>
