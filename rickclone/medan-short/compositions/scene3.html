<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /></head>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; background: #000; overflow: hidden; }
    #s3-shakewrap { position: absolute; inset: 0; }
    #s3-kb { position: absolute; inset: 0; will-change: transform; }
    #s3-kb img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
    #s3-img-b { opacity: 0; }
    #s3-dip { position: absolute; inset: 0; background: #000; opacity: 0; }
  </style>
  <div id="root" data-composition-id="scene3" data-width="1080" data-height="1920">
    <div id="s3-kb" data-layout-allow-overflow>
      <img id="s3-img-a" src="assets/shot3_a.jpg" alt="" />
      <img id="s3-img-b" src="assets/shot3_b.jpg" alt="" />
    </div>
    <div id="s3-dip" data-layout-ignore></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s3-kb", { scale: 1 }, { scale: 1.18, z: 0.001, force3D: true, duration: 5.650, ease: "power2.inOut" }, 0);

      for (let i = 1, t = 0.33; t < 5.8; i++, t += 0.33) {
        tl.set("#s3-img-b", { opacity: i % 2 }, Number(t.toFixed(3)));
      }
      tl.fromTo("#s3-dip", { opacity: 0.35 }, { opacity: 0, duration: 0.14, ease: "power2.out" }, 0);
      tl.to("#s3-dip", { opacity: 0.35, duration: 0.1, ease: "power2.in" }, 5.70);

      window.__timelines["scene3"] = tl;
    })();
  </script>
</template>
</body>
</html>
