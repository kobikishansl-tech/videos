<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /></head>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; background: #000; overflow: hidden; }
    #s8-shakewrap { position: absolute; inset: 0; }
    #s8-kb { position: absolute; inset: 0; will-change: transform; }
    #s8-kb img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
    #s8-img-b { opacity: 0; }
    #s8-dip { position: absolute; inset: 0; background: #000; opacity: 0; }
    #s8-flash { position: absolute; inset: 0; background: #ffffff; opacity: 0; }
  </style>
  <div id="root" data-composition-id="scene8" data-width="1080" data-height="1920">
    <div id="s8-shakewrap" style="position:absolute; inset:0;">
    <div id="s8-kb" data-layout-allow-overflow>
      <img id="s8-img-a" src="assets/shot8_a.jpg" alt="" />
      <img id="s8-img-b" src="assets/shot8_b.jpg" alt="" />
    </div>
    </div>
    <div id="s8-dip" data-layout-ignore></div>
    <div id="s8-flash" data-layout-ignore></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s8-kb", { scale: 1.16 }, { scale: 1.28, z: 0.001, force3D: true, duration: 1.600, ease: "power3.inOut" }, 0);

      for (let i = 1, t = 0.33; t < 8; i++, t += 0.33) {
        tl.set("#s8-img-b", { opacity: i % 2 }, Number(t.toFixed(3)));
      }
      tl.fromTo("#s8-dip", { opacity: 0.35 }, { opacity: 0, duration: 0.14, ease: "power2.out" }, 0);
      tl.to("#s8-dip", { opacity: 0.35, duration: 0.1, ease: "power2.in" }, 7.90);
      tl.fromTo("#s8-flash", { opacity: 1 }, { opacity: 0, duration: 0.14, ease: "power2.out" }, 0);
      let seed = 20247;
      const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
      const kf = [];
      const shakeLen = 2.30;
      for (let t = 0.08; t < shakeLen; t += 0.1) {
        const a = 5.0 * (1 - (t - 0.08) / (shakeLen - 0.08));
        kf.push({ x: ((rnd() * 2 - 1) * a).toFixed(2), y: ((rnd() * 2 - 1) * a).toFixed(2), duration: 0.1, ease: "none" });
      }
      tl.to("#s8-shakewrap", { keyframes: kf }, 0.08);

      window.__timelines["scene8"] = tl;
    })();
  </script>
</template>
</body>
</html>
